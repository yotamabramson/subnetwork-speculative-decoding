# SSD vs EAGLE-3, head to head on Llama-3.1-8B-Instruct (see PLAN_H100_EAGLE3.md).
# Every setting below follows EAGLE-3 (paper + SafeAILab/EAGLE @ cb7e084) unless noted.
model:
  base_model: meta-llama/Llama-3.1-8B-Instruct    # EAGLE-3's 8B target
  torch_dtype: bfloat16      # training; evaluation runs fp16 like EAGLE (eagle_bench --dtype float16)
  device: auto
  attn_implementation: sdpa

# SSD's only methodological choice: first-middle-last layers of the 32-layer model.
draft_layers: [0, 16, 31]

bridge:
  mlp_type: mlp
  num_layers: 2
  hidden_dim: null           # d_model (4096)
  activation: silu
  bias: true
  init_std: 1.0e-3
  dtype: float32

data:
  format: eagle3             # one conversation per row, assistant-only loss (EAGLE's preprocessing, verbatim)
  local_path: data/eagle3_regen.jsonl   # ShareGPT + UltraChat-200K regenerated by the target
  max_len: 2048              # EAGLE drops longer conversations

training:
  output_dir: outputs/llama31_8b_eagle3
  seed: 0
  log_every: 50
  save_every: 2000
  stage1:                    # SSD-specific warm-up of the bridges (EAGLE-3 has no equivalent)
    steps: 2000
    batch_size: 16
    lr: 1.0e-4
    warmup_steps: 100
    alpha_mse: 1.0
    beta_cos: 1.0
    mode: teacher
  stage2:
    steps: 33000             # ≈1 epoch at 16 conversations/step (budget decision 2); set from the data size
    batch_size: 16           # EAGLE: micro-batch 1 x grad-accum 2 x N GPUs
    micro_batch: 1
    lr: 5.0e-5               # EAGLE-3
    warmup_steps: 500        # EAGLE: 12k of 800k steps; scaled to our run length
    grad_clip: 0.5           # EAGLE-3
    temperature: 1.0         # EAGLE-3 loss: soft cross-entropy vs the target's softmax (T=1) ...
    kd_weight: 1.0
    ce_weight: 0.0           # ... and no ground-truth term
    ttt_steps: 7             # EAGLE-3 training-time test: length 7
    ttt_decay: 0.8           # EAGLE-3: step i weighted 0.8**i

drafting:
  # EAGLE-3 eval: total_token 60 (= 59 drafted + root), top_k 10; depth settled in Phase 1.
  depth: 7
  branch: 10
  width: 10
  max_nodes: 59
  temperature: 0.0
  top_p: 1.0
  draft_vocab: 32000         # EAGLE-3's draft vocabulary size (top assistant tokens)
